# ═══════════════════════════════════════════════════════════════════════
#  سجل المصادر الرسمية — مملكة البحرين
#  Official source registry. Two jobs:
#    1. `domains` هي قائمة السماح الشبكية لوكيل المصادر (archivist) وحده.
#       scripts/provision.sh يقرأها ويحقنها في networkAllowlist.
#       أي نطاق غير مذكور هنا لا يستطيع الوكيل بلوغه — فرض بـbwrap لا بالتعليمات.
#    2. `instruments` قائمة التشريعات المطلوب استيرادها للمدونة المحلية.
#
#  ⚠ تنبيه صدق مهم:
#  أرقام وسنوات التشريعات أدناه هي **مرشّحات للتحقق** وليست حقائق مثبتة.
#  لم يُتحقق منها آليًا (بيئة البناء تحجب النطاقات البحرينية).
#  خط الاستيراد `tools/ingest` يقارن كل عنوان ورقم بالنص الرسمي المُنزَّل
#  ويضع `verified: true` فقط بعد المطابقة، ويرفع تعارضًا عند الاختلاف.
#  لا يُسمح لأي وكيل بالاستشهاد بتشريع لم يُستورد ويُتحقق منه.
# ═══════════════════════════════════════════════════════════════════════

schema: airlock-sources/v1
jurisdiction: BH

