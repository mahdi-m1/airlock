# ── الفهارس الرسمية ───────────────────────────────────────────────────
# صفحات تسرد التشريعات وتربط إلى نصوصها. يقرؤها:
#     python3 scripts/build-corpus.py --discover
# فيستخرج كل رابط ونصه، ويطابقها بالتشريعات التي لا رابط لها في هذا السجل،
# ويرشّح لكل تشريع أقرب الروابط مع سبب الترجيح.
#
# المطابقة على **نص الرابط** لا على متن التشريع: قد يحمل الفهرس عنوانًا
# مختصرًا، أو يشير إلى مرسوم تعديل بعنوان أصله. فالأداة ترشّح ولا تقرّر،
# والتحقق النهائي عند الاستيراد بمقارنة العنوان بالنص المُنزَّل نفسه.
#
# كل نطاق هنا يجب أن يكون في `domains` أعلاه، وإلا رُفض الطلب.
catalogs:
  - url: "https://www.lloc.gov.bh/ElectronicLibrary"
    name: المكتبة الإلكترونية — هيئة التشريع والرأي القانوني
    note: أفاد بها صاحب المكتب — فهرس التشريعات والموارد القانونية

# ── التشريعات المطلوبة ────────────────────────────────────────────────
# type: law (قانون) | dl (مرسوم بقانون) | dec (مرسوم) | ord (قرار وزاري)
# رمز الاستشهاد المُولَّد: ⟦BH:<type>:<number>/<year>:م<article>⟧
#
# `url` رابط صفحة التشريع في مصدره الرسمي. **كل الحقول فارغة**: لم أصل إلى
# legislation.bh قط (بيئة البناء تحجب النطاقات البحرينية)، وكتابة روابط
# مُخمَّنة كانت سترسلك في مطاردة أخطاء مختلقة.
#
# سجّله وأنت تتصفح، فتُثبَّت الخطوة الأصعب مرة واحدة:
#     python3 tools/ingest/ingest.py --set-url civil-code "https://..."
#
# الأمر يرفض أي نطاق خارج قائمة `domains` أعلاه، فلا يدخل الملف رابط لمصدر
# غير رسمي. وبعد ملئه:
#   • يُسجَّل الرابط مع كل مادة في المدونة، فيظهر في نتائج البحث كمرجع.
#   • يصير `--fetch` ممكنًا للتحديث الآلي بدل التنزيل اليدوي في كل مرة.
#
# `gazette_issue` و`gazette_date` — رقم عدد الجريدة الرسمية وتاريخ النشر فيه.
# **الجريدة الرسمية هي المرجع النهائي الملزم**: القانون لا ينفذ إلا بالنشر فيها،
# فرقم العدد وتاريخه هما ما يُثبت أن النص الذي استوردته هو النافذ.
#
# سجّلها مع الرابط دفعة واحدة:
#     python3 tools/ingest/ingest.py --set-provenance civil-code \
#         --url "https://..." --gazette 2501 --date 2001-09-06
#
# وعند `require_gazette_provenance: true` في config/office.yaml (الافتراضي)
# لا يُوسم تشريع `verified` بدونها، فلا يستطيع أي وكيل الاستشهاد به.
#
# `amendments` التشريعات التي عدّلت هذا النص، و`consolidated` هل النص المستورد
# مدمج التعديلات أم النسخة الأصلية كما صدرت.
#
# هذا أخطر ما في المدونة: الاستشهاد بمادة عُدّلت — بنصها الأصلي — خطأ لا تلتقطه
# أي بوابة، لأن المادة موجودة ورقمها صحيح ونصها مطابق لما استُورد. والمحكمة
# تطبّق النص النافذ لا النص الأصلي.
#
# فعند `consolidated: false` مع وجود تعديلات، يظهر تنبيه بارز في كل نتيجة بحث
# وكل عرض مادة وفي تقرير بوابة الإسناد. استورد النسخة المدمجة إن توفّرت، أو
# استورد التعديلات نفسها كتشريعات مستقلة وراجع أثرها على كل مادة تستشهد بها.
