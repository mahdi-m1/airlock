# ── إعدادات الاستيراد ─────────────────────────────────────────────────
ingest:
  # مجلد التجهيز: الملفات الرسمية المُنزَّلة (HTML/نص) قبل التحليل.
  staging_dir: corpus/staging
  # مخرجات المدونة (لا تُرفع للمستودع — انظر corpus/.gitignore)
  index_db: corpus/index/corpus.db
  records_jsonl: corpus/index/records.jsonl
  user_agent: "airlock-legal-office/1.0 (local legal corpus ingest)"
  request_timeout_sec: 30
  # التحقق من العنوان: نسبة التطابق الدنيا بين العنوان المُعلن والنص المُستورد
  title_match_threshold: 0.6
